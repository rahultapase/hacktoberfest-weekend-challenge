<!doctype html>
<html lang="hi-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tuition Register</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">📒</span>
      <div><h1>Tuition Register</h1><p class="tagline" data-i18n="tagline"></p></div>
    </div>
    <div class="top-right">
      <span id="status-chip" class="chip" role="status">…</span>
      <button id="lang-toggle" type="button" class="ghost" aria-pressed="false">English</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-likho" aria-controls="panel-likho" aria-selected="true" data-tab="likho">
      <span data-i18n="tab_likho"></span><small data-i18n2="tab_likho"></small></button>
    <button role="tab" id="tab-check" aria-controls="panel-check" aria-selected="false" tabindex="-1" data-tab="check">
      <span data-i18n="tab_check"></span><small data-i18n2="tab_check"></small>
      <span id="tray-count" class="count" hidden></span></button>
    <button role="tab" id="tab-baaki" aria-controls="panel-baaki" aria-selected="false" tabindex="-1" data-tab="baaki">
      <span data-i18n="tab_baaki"></span><small data-i18n2="tab_baaki"></small></button>
    <button role="tab" id="tab-bachche" aria-controls="panel-bachche" aria-selected="false" tabindex="-1" data-tab="bachche">
      <span data-i18n="tab_bachche"></span><small data-i18n2="tab_bachche"></small></button>
    <button role="tab" id="tab-poocho" aria-controls="panel-poocho" aria-selected="false" tabindex="-1" data-tab="poocho">
      <span data-i18n="tab_poocho"></span><small data-i18n2="tab_poocho"></small></button>
  </nav>

  <main id="main">
    <!-- PIN (only when TR_PIN is set on the server) -->
    <section id="pin-box" class="panel" hidden>
      <form id="pin-form">
        <label for="pin-input" data-i18n="pin_label"></label>
        <input id="pin-input" type="password" inputmode="numeric" autocomplete="off" required>
        <button type="submit" class="primary" data-i18n="pin_go"></button>
      </form>
    </section>

    <!-- 1. Likho / Write -->
    <section id="panel-likho" class="panel" role="tabpanel" aria-labelledby="tab-likho">
      <form id="write-form">
        <label for="line" data-i18n="write_label"></label>
        <textarea id="line" rows="3" maxlength="1000" required
          placeholder="riya nahi aayi, aman ne 1500 diye oct ke, baaki 500 next week"></textarea>
        <div class="row">
          <div>
            <label for="entry-date" data-i18n="date_label"></label>
            <input id="entry-date" type="date" required>
          </div>
          <button id="read-btn" type="submit" class="primary big" data-i18n="read_btn"></button>
        </div>
      </form>
      <div id="parse-status" class="muted" role="status" aria-live="polite"></div>
      <div id="cards" aria-live="polite"></div>
      <div id="cards-actions" class="row" hidden>
        <button id="save-green" type="button" class="primary big" data-i18n="save_green"></button>
      </div>
      <h2 data-i18n="today_saved"></h2>
      <ul id="today-list" class="plain"></ul>
    </section>

    <!-- 2. Check karo / Confirm tray -->
    <section id="panel-check" class="panel" role="tabpanel" aria-labelledby="tab-check" hidden>
      <p class="muted" data-i18n="tray_help"></p>
      <div id="tray" aria-live="polite"></div>
    </section>

    <!-- 3. Baaki / Dues -->
    <section id="panel-baaki" class="panel" role="tabpanel" aria-labelledby="tab-baaki" hidden>
      <div class="row">
        <div>
          <label for="dues-month" data-i18n="month_label"></label>
          <input id="dues-month" type="month">
        </div>
      </div>
      <div id="dues-total" class="stats" aria-live="polite"></div>
      <ul id="dues-list" class="plain"></ul>
      <div id="student-detail" hidden></div>
    </section>

    <!-- 4. Bachche / Students -->
    <section id="panel-bachche" class="panel" role="tabpanel" aria-labelledby="tab-bachche" hidden>
      <ul id="students-list" class="plain"></ul>
      <details>
        <summary data-i18n="add_student"></summary>
        <form id="student-form" class="grid">
          <label for="s-name" data-i18n="s_name"></label><input id="s-name" required maxlength="80">
          <label for="s-aliases" data-i18n="s_aliases"></label><input id="s-aliases" maxlength="200" placeholder="Riyu, Chhotu">
          <label for="s-batch" data-i18n="s_batch"></label><input id="s-batch" maxlength="20">
          <label for="s-fee" data-i18n="s_fee"></label><input id="s-fee" type="number" min="0" max="100000" required>
          <label for="s-start" data-i18n="s_start"></label><input id="s-start" type="month" required>
          <button type="submit" class="primary" data-i18n="save"></button>
        </form>
      </details>
      <details>
        <summary data-i18n="import_csv"></summary>
        <form id="import-form">
          <label for="csv-file" data-i18n="csv_label"></label>
          <input id="csv-file" type="file" accept=".csv,text/csv" required>
          <button type="submit" class="primary" data-i18n="import_btn"></button>
        </form>
      </details>
      <p id="students-msg" role="status" aria-live="polite"></p>
    </section>

    <!-- 5. Poocho / Ask -->
    <section id="panel-poocho" class="panel" role="tabpanel" aria-labelledby="tab-poocho" hidden>
      <form id="ask-form">
        <label for="question" data-i18n="ask_label"></label>
        <input id="question" maxlength="300" required placeholder="kis kis ka october baaki hai?">
        <button type="submit" class="primary big" data-i18n="ask_btn"></button>
      </form>
      <div id="ask-examples" class="chips"></div>
      <div id="answer" class="answer" role="status" aria-live="polite"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <footer class="muted foot" data-i18n="footer"></footer>
</body>
</html>
